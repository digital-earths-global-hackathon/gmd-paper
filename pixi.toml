[workspace]
name = "lecture-materials"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[pypi-dependencies]
beautifulsoup4 = "*"
aiohttp = "*"
icalendar = "*"
intake = "*"
intake-xarray = "*"
jupyter = "*"
jupyter-cache = "*"
markdown2 = "*"
matplotlib = "*"
pyyaml = "*"
pre-commit = "*"
requests = "*"
xarray = "*"
zarr = "*"

[dependencies]
python = "=3.12"
netcdf4 = ">=1.7.2"
quarto = "==1.6.40"

[tasks]
# Figures are generated by scripts. Each script writes one file per output
# format: svg is what the html build embeds, pdf keeps the figure vector in
# the LaTeX build. index.qmd refers to them without an extension.
figure-timeline = { cmd = [
  "python", "scripts/plot_preparation_timeline.py",
  "Images/preparation_timeline.svg", "Images/preparation_timeline.pdf",
], inputs = [
  "scripts/plot_preparation_timeline.py",
], outputs = [
  "Images/preparation_timeline.svg", "Images/preparation_timeline.pdf",
] }
figures = { depends-on = ["figure-timeline"] }

render = { cmd = ["quarto", "render", "index.qmd"], depends-on = ["figures"] }
render-pdf = { cmd = ["quarto", "render", "index.qmd", "--to", "copernicus-gmd-pdf"], depends-on = ["figures"] }
preview = { cmd = ["quarto", "preview", "index.qmd", "--no-navigate"], depends-on = ["figures"] }
